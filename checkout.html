<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Order - Sup Tulang ZZ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="customer-portal">
    <div class="page-header">
        <h1>Order</h1>
    </div>

    <main class="checkout-wrapper">

        <div class="order-summary">
            <h3>Your Order:</h3>
            <div id="checkout-list"></div>
            <hr>
            <h3 id="total-price"></h3>
        </div>

        <form id="order-form" action="process/add_order.php" method="POST">
            <input type="hidden" name="cart_items" id="cart-items-input">
            <input type="hidden" name="total_amount" id="total-amount-input">
            <div class="form-row">
                <label>Order Type:</label>
                <select id="order-type" name="order_type" onchange="toggleFields()">
                    <option value="online">Online Order</option>
                    <option value="walkin-takeaway">Walk-in Takeaway</option>
                    <option value="walkin-dinein">Walk-in Dine-in</option>
                </select>
            </div>

            <div id="dynamic-fields"></div>

            <div class="form-row">
                <label>Payment Method:</label>
                <select name="payment_method">
                    <option>Cash</option>
                    <option>Online Banking</option>
                    <option>Credit/Debit Card</option>
                </select>
            </div>

            <button type="submit" class="add-btn">Confirm Order</button>
        </form>
    </main>

    <script>
        const cart = JSON.parse(localStorage.getItem('myCart')) || [];
        const listDiv = document.getElementById('checkout-list');
        const totalDiv = document.getElementById('total-price');

        let total = 0;
        cart.forEach(item => {
            listDiv.innerHTML += `<p><strong>${item.name}</strong> - ${item.price}</p>`;
            total += parseFloat(item.price.replace('RM ', ''));
        });
        totalDiv.innerText = `Total: RM ${total.toFixed(2)}`;

        // Show general remark if present
        const generalRemark = localStorage.getItem('cartRemark');
        if (generalRemark) {
            const remarkDiv = document.createElement('div');
            remarkDiv.style.marginTop = '15px';
            remarkDiv.style.padding = '10px';
            remarkDiv.style.background = '#f0e6d2';
            remarkDiv.style.borderLeft = '4px solid #8B4513';
            remarkDiv.style.fontSize = '0.95rem';
            remarkDiv.innerHTML = `<strong>Remark:</strong> <span style="font-style: italic; color: #555;">${generalRemark}</span>`;
            listDiv.appendChild(remarkDiv);
        }

        function toggleFields() {
            const type = document.getElementById('order-type').value;
            // Start with Full Name for all types
            let html = `<div class="form-row"><label>Full Name:</label><input type="text" name="customer_name" required></div>`;

            if (type === 'online') {
                html += `<div class="form-row"><label>Phone Number:</label><input type="text" name="phone" required></div>
                         <div class="form-row"><label>Email:</label><input type="email" name="email" required></div>
                         <div class="form-row"><label>Shipping Address:</label><textarea name="address" required></textarea></div>`;
            } else if (type === 'walkin-takeaway') {
                html += `<div class="form-row"><label>Email:</label><input type="email" name="email" required></div>
                         <div class="form-row"><label>Phone Number:</label><input type="text" name="phone" required></div>`;
            } else if (type === 'walkin-dinein') {
                html += `<div class="form-row"><label>Table Number:</label><input type="number" name="table_no" required></div>
                         <div class="form-row"><label>Email:</label><input type="email" name="email" required></div>`;
            }
            document.getElementById('dynamic-fields').innerHTML = html;

            // Auto-fill Table Number if stored in localStorage
            const savedTable = localStorage.getItem('tableNumber');
            if (type === 'walkin-dinein' && savedTable) {
                const tableInput = document.querySelector('input[name="table_no"]');
                if (tableInput) {
                    tableInput.value = savedTable;
                }
            }
        }

        // Auto-detect table number from localStorage to preset order type
        const savedTable = localStorage.getItem('tableNumber');
        if (savedTable) {
            const selectEl = document.getElementById('order-type');
            if (selectEl) {
                selectEl.value = 'walkin-dinein';
            }
        }

        // Initialize fields on load
        toggleFields();

        document.getElementById('order-form').onsubmit = (e) => {
            const cartInput = document.getElementById('cart-items-input');
            const totalInput = document.getElementById('total-amount-input');
            cartInput.value = JSON.stringify(cart);
            totalInput.value = total.toFixed(2);
            localStorage.removeItem('myCart');
            localStorage.removeItem('tableNumber');
        };
    </script>
</body>

</html>
