<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Sup Tulang ZZ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Maroon Header Styling */
        .cart-header {
            background-color: #8B4513;
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #5D2E0A;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        #order-remark:focus {
            border-color: #8B4513 !important;
            box-shadow: 0 0 5px rgba(139, 69, 19, 0.3);
        }

        .total-section {
            margin-top: 20px;
            text-align: right;
            font-weight: bold;
            font-size: 1.3rem;
            color: #8B4513;
        }
    </style>
</head>

<body class="customer-portal">

    <div class="cart-header">
        <h1>Cart</h1>
    </div>

    <main class="menu-container" style="max-width: 600px; margin: 40px auto;">

        <div id="cart-list"></div>

        <div id="total-price" class="total-section"></div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <a href="index.html" class="add-btn" style="flex:1; text-align:center; text-decoration:none;">Back to
                Menu</a>
            <button onclick="window.location.href='checkout.html'" class="add-btn"
                style="flex:1; background-color: #28a745;">Proceed to Checkout</button>
        </div>
    </main>

    <script>
        // 1. Load the cart data from localStorage
        const cart = JSON.parse(localStorage.getItem('myCart')) || [];
        const listDiv = document.getElementById('cart-list');
        const totalDiv = document.getElementById('total-price');

        // 2. Render items
        if (cart.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center;'>Your cart is currently empty.</p>";
            // Hide total and checkout button if empty
            if (totalDiv) totalDiv.style.display = 'none';
            const checkoutBtn = document.querySelector('button[onclick*="checkout.html"]');
            if (checkoutBtn) checkoutBtn.style.display = 'none';
        } else {
            let total = 0;
            listDiv.innerHTML = '';
            cart.forEach((item, idx) => {
                // Extract numeric value from string "RM 9.50" -> 9.50
                const priceValue = parseFloat(item.price.replace('RM ', ''));
                total += priceValue;

                listDiv.innerHTML += `
                    <div class="cart-item" style="display: flex; flex-direction: column; border-bottom: 1px solid #ddd; padding: 15px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                            <span style="font-weight: 600; color: #8B4513; flex: 1; padding-right: 15px; text-align: left;">${item.name}</span>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span style="font-weight: 600;">${item.price}</span>
                                <button onclick="removeFromCart(${idx})" style="background: none; border: none; color: #5E2A25; font-size: 1.2rem; cursor: pointer; padding: 0 5px;" title="Remove item">✕</button>
                            </div>
                        </div>
                        <div style="margin-top: 8px; text-align: left; width: 100%;">
                            <input type="text" class="item-remark" data-index="${idx}" placeholder="Add note (e.g. No spicy, extra gravy...)" value="${escHtml(item.customization_notes || '')}" style="width: 100%; padding: 6px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 0.88rem; outline: none; transition: border-color 0.2s;" oninput="updateItemRemark(${idx}, this.value)">
                        </div>
                    </div>`;
            });
            // 3. Display Total
            totalDiv.innerHTML = `Total: RM ${total.toFixed(2)}`;
        }

        // 3b. Remove item handler
        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('myCart', JSON.stringify(cart));
            window.location.reload();
        }

        // 4. Update individual item remark handler
        function updateItemRemark(index, val) {
            cart[index].customization_notes = val;
            localStorage.setItem('myCart', JSON.stringify(cart));
        }

        function escHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>

</html>
